# Publishes all modules to Maven Central (Sonatype Central Portal) under the `com.jawnnypoo`
# namespace whenever a tag is pushed. The pushed tag name becomes the published version
# (e.g. tag `0.0.1-wasm` -> com.jawnnypoo:firebase-firestore:0.0.1-wasm).
#
# Required repository (or org) secrets — reused from the PhysicsBox setup:
#   MAVEN_CENTRAL_USERNAME  - Central Portal user token username
#   MAVEN_CENTRAL_PASSWORD  - Central Portal user token password
#   SIGNING_PRIVATE_KEY     - ASCII-armored GPG private key (in-memory signing)
#   SIGNING_PASSWORD        - passphrase for the GPG key
#
# Runs on macOS because the Apple targets bind the native Firebase iOS SDK via CocoaPods.

name: Publish

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_PRIVATE_KEY }}
  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}

jobs:
  publish:
    runs-on: macos-latest
    if: github.repository == 'Jawnnypoo/firebase-kotlin-sdk'
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: gradle
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      # Single aggregated deployment: builds every target (android, jvm, js, wasmJs, ios,
      # macos, tvos) for all modules and uploads them to one Central Portal deployment,
      # which `automaticRelease = true` then releases automatically. The version is the tag.
      - name: Publish to Maven Central
        run: >
          ./gradlew publishAndReleaseToMavenCentral
          -PVERSION_NAME="${GITHUB_REF_NAME}"
          --no-configuration-cache
          --stacktrace
